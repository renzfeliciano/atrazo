name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --audit-level high --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests (unit, use case, Postgres integration via PGlite, API, two-phone sync)
        run: pnpm test
      - name: Migrations match the schema
        run: pnpm db:check
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:6060
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
