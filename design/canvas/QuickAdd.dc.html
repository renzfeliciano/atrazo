<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atrazo · New entry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="atrazo.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Archivo:wdth,wght@62..125,400..800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" data-theme="{{theme}}">

<header class="bar" style="padding-left: 4px">
<a href="Main.dc.html" class="icon-btn" aria-label="Close without saving" style="color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<div class="bar-title">
<h1>New entry</h1>
<span class="bar-sub">Saves to this phone, then backs up</span>
</div>
<button type="button" class="btn btn-ink btn-sm" style="margin-right: 8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today, Nov 5</button>
</header>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 16px">

<div class="seg seg-entry" role="group" aria-label="Entry type">
<button type="button" class="is-utang" aria-pressed="{{utangPressed}}" onClick="{{setUtang}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Utang</button>
<button type="button" class="is-bayad" aria-pressed="{{bayadPressed}}" onClick="{{setBayad}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>Bayad</button>
</div>

<button type="button" class="card" onClick="{{nextClient}}" aria-label="Client: {{client.name}}. Tap to change" style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 12px 0 14px; font: inherit; color: var(--text); text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 12px; font-weight: 600; color: var(--muted)">Client</span>
<span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{client.name}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
<span style="font-size: 12px; color: var(--muted)">Balance</span>
<span class="mono" style="font-size: 14px; font-weight: 600">{{balText}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><path d="m7 10 5 5 5-5"></path></svg>
</button>

<section class="card" aria-live="polite" aria-label="Amount and new balance" style="padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px">
<span class="tag {{modeTag}}">{{modeLabel}}</span>
<span class="tape" style="font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{exprText}}</span>
</div>
<div style="display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; color: {{amountColor}}">
<span class="disp" style="font-size: 22px; opacity: .7">{{sign}}₱</span>
<span class="disp mono" style="font-size: 42px; line-height: 1.05">{{amountText}}</span>
</div>
<div aria-hidden="true" style="border-top: 1px dashed var(--line-strong); margin: 2px 0"></div>
<div class="tape" style="display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted)"><span>Balance now</span><span>{{balText}}</span></div>
<div class="tape" style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600"><span>After saving</span><span>{{newBalText}}</span></div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 2px">
<span class="meter {{meterClass}}" aria-hidden="true" style="flex: 1"><span style="width: {{pct}}"></span></span>
<sc-if value="{{isOver}}" hint-placeholder-val="{{ false }}"><span class="tag tag-danger"><span class="pip"></span>{{overBy}} over limit</span></sc-if>
<sc-if value="{{notOver}}" hint-placeholder-val="{{ true }}"><span class="mono" style="font-size: 12.5px; color: var(--muted)">{{roomText}}</span></sc-if>
</div>
</section>

<div class="input-wrap">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: var(--muted)"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
<label for="entry-note" class="sr">Note</label>
<input id="entry-note" class="input" placeholder="Note: what did they get? (optional)" style="height: 44px; padding-left: 38px; font-size: 15px">
</div>

<div class="pad" role="group" aria-label="Calculator">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="20">
<button type="button" class="key {{k.cls}}" aria-label="{{k.aria}}" onClick="{{k.press}}">{{k.label}}</button>
</sc-for>
</div>

<sc-if value="{{canSave}}" hint-placeholder-val="{{ true }}">
<a href="Ledger.dc.html" class="btn btn-lg btn-block {{saveCls}}" style="margin-top: auto">{{saveLabel}}</a>
</sc-if>
<sc-if value="{{cannotSave}}" hint-placeholder-val="{{ false }}">
<button type="button" class="btn btn-lg btn-block" disabled style="margin-top: auto">Enter an amount</button>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = st.mode || 'utang';
    const expr = st.expr ?? '3×25+75';
    const ci = st.ci || 0;
    const clients = [
      { name: 'Aling Nena Santos', bal: 2150, limit: 3000 },
      { name: 'Mang Jose Reyes', bal: 1850, limit: 1500 },
      { name: 'Tito Ramon Garcia', bal: 980.5, limit: 1500 },
      { name: 'Carla Villanueva', bal: 760, limit: 1000 }
    ];
    const client = clients[ci % clients.length];
    const money = (v) => Math.abs(v).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const peso = (v) => (v < 0 ? '−' : '') + '₱' + money(v);
    const evaluate = (s) => {
      const toks = s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g) || [];
      while (toks.length && /[+\-×÷]/.test(toks[toks.length - 1])) toks.pop();
      if (!toks.length) return 0;
      const terms = []; let cur = parseFloat(toks[0]) || 0; let addOp = '+';
      for (let i = 1; i < toks.length; i += 2) {
        const op = toks[i]; const n = parseFloat(toks[i + 1]) || 0;
        if (op === '×') cur *= n; else if (op === '÷') cur = n ? cur / n : 0;
        else { terms.push(addOp === '+' ? cur : -cur); addOp = op; cur = n; }
      }
      terms.push(addOp === '+' ? cur : -cur);
      return Math.round(terms.reduce((a, b) => a + b, 0) * 100) / 100;
    };
    const amt = Math.max(0, evaluate(expr));
    const hasOp = /[+\-×÷]/.test(expr.replace(/^-/, ''));
    const delta = mode === 'utang' ? amt : -amt;
    const newBal = client.bal + delta;
    const over = newBal - client.limit;
    const pct = Math.max(0, Math.min(100, Math.round((newBal / client.limit) * 100)));
    const set = (e) => this.setState({ expr: e });
    const push = (ch) => () => {
      let e = expr;
      if (/[+\-×÷]/.test(ch)) { if (!e) return; if (/[+\-×÷]$/.test(e)) e = e.slice(0, -1); set(e + ch); return; }
      const lastNum = (e.split(/[+\-×÷]/).pop()) || '';
      if (ch === '.' && lastNum.includes('.')) return;
      if (/\.\d\d$/.test(lastNum)) return;
      if (lastNum.replace('.', '').length >= 7) return;
      set(e + ch);
    };
    const K = (label, cls, press, aria) => ({ label, cls: cls || '', press, aria: aria || label });
    const keys = [
      K('C', 'key-fn', () => set(''), 'Clear'), K('⌫', 'key-fn', () => set(expr.slice(0, -1)), 'Backspace'), K('00', 'key-fn', push('00')), K('÷', 'key-op', push('÷'), 'Divide'),
      K('7', '', push('7')), K('8', '', push('8')), K('9', '', push('9')), K('×', 'key-op', push('×'), 'Times'),
      K('4', '', push('4')), K('5', '', push('5')), K('6', '', push('6')), K('−', 'key-op', push('-'), 'Minus'),
      K('1', '', push('1')), K('2', '', push('2')), K('3', '', push('3')), K('+', 'key-op', push('+'), 'Plus'),
      K('0', 'key-wide', push('0')), K('.', '', push('.'), 'Decimal point'), K('=', 'key-eq', () => set(amt ? String(amt) : ''), 'Equals')
    ];
    return {
      theme: this.props.theme ?? 'light',
      client, keys,
      utangPressed: mode === 'utang' ? 'true' : 'false',
      bayadPressed: mode === 'bayad' ? 'true' : 'false',
      setUtang: () => this.setState({ mode: 'utang' }),
      setBayad: () => this.setState({ mode: 'bayad' }),
      nextClient: () => this.setState({ ci: (ci + 1) % clients.length }),
      modeLabel: mode === 'utang' ? 'Utang · adds to balance' : 'Bayad · lowers balance',
      modeTag: mode === 'utang' ? 'tag-warn' : 'tag-info',
      exprText: hasOp ? expr.replace(/([+\-×÷])/g, ' $1 ').replace(/-/g, '−') + ' =' : ' ',
      sign: amt ? (mode === 'utang' ? '+' : '−') : '',
      amountText: money(amt),
      amountColor: !amt ? 'var(--faint)' : (mode === 'utang' ? 'var(--text)' : 'var(--info)'),
      balText: peso(client.bal),
      newBalText: peso(newBal),
      pct: pct + '%',
      meterClass: over > 0 ? 'is-danger' : '',
      isOver: over > 0, notOver: !(over > 0),
      overBy: '₱' + money(over),
      roomText: '₱' + money(Math.max(0, client.limit - newBal)) + ' left of ₱' + client.limit.toLocaleString('en-PH'),
      canSave: amt > 0, cannotSave: !(amt > 0),
      saveCls: mode === 'utang' ? 'btn-primary' : 'btn-info',
      saveLabel: (mode === 'utang' ? 'Save utang · ₱' : 'Save bayad · ₱') + money(amt)
    };
  }
}
</script>
</body>
</html>
